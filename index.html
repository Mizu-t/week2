<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
    <header>
      <h1 class="font-bold">カフェメニュー</h1>
    </header>
    <main>
      <section>
      <div class="bg-white rounded-lg shadow p-20">
        <h1 class="text-2xl font-bold mb-4">ドリンクメニュー</h1>
        <p class="text-blue-600">カフェラテ 350円</p>
        <p>甘くておいしいカフェラテは、ミルクとエスプレッソの絶妙なバランスが特徴です。</p>
        <p class="text-blue-600">カフェモカ 380円</p>
        <p>チョコレートの風味が楽しめるカフェモカは、甘さと苦さのバランスが絶妙です。</p>
        <p class="text-blue-600">カフェアメリカノ 300円</p>
        <p>シンプルでありながら深い味わいのカフェアメリカノは、コーヒー本来の香りを楽しめます。</p>
      </div>
      </section>
      <section>
      <div class="bg-pink-100 rounded-lg shadow p-20">
        <h1 class="text-2xl font-bold mb-4">フードメニュー</h1>
        <p class="text-blue-600">カレー 850円</p>
        <p>母の味です！</p>
      </div>
      </section>
      <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">注文する</button>
      <a href="#" class="text-blue-600 underline hover:text-blue-800">詳細を見る</a>
    </main>
</body>
</html>
